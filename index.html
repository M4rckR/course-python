<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bitácora CS50P</title>
<script>try{const t=(JSON.parse(localStorage.getItem("cs50p:v1"))||{}).theme;if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main">Saltar al contenido</a>
<header class="app-header">
  <div class="app-header__inner">
    <a class="app-logo" href="#/">Bitácora <span>CS50P</span></a>
    <nav class="app-nav" aria-label="Principal"><a href="#/" id="navHome">Inicio</a><a href="#/w/0" id="navWeeks">Semanas</a></nav>
    <div class="global-progress" id="globalProgress" role="progressbar" aria-valuemin="0" aria-valuenow="0" aria-valuemax="0" aria-label="Progreso global">
      <span class="global-progress__label">Progreso global</span>
      <span class="global-progress__track"><span class="global-progress__fill" id="progBar"></span></span>
      <span class="global-progress__value" id="progTxt">0/0</span>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button"><span class="theme-toggle__text">Modo oscuro</span><svg class="theme-toggle__icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path class="theme-toggle__moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/><g class="theme-toggle__sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg></button>
  </div>
</header>
<nav class="week-tabs" id="weeks" aria-label="Semanas"><div class="week-tabs__inner" id="weeksInner"></div></nav>
<main id="main" class="app" tabindex="-1"></main>
<script src="app.js"></script>
</body>
</html>
