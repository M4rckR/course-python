<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bitácora CS50P — 1f Modo foco · móvil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>*{box-sizing:border-box}body{margin:0;padding:40px;background:#D9D5CC;color:#1D1C1A;font-family:'Atkinson Hyperlegible',sans-serif}a{color:#2346C8}a:hover{color:#16308F}</style>
</head>
<body>
<div id="1f" style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;gap:8px;align-items:center;font:500 13px 'JetBrains Mono',monospace"><span style="background:#1D1C1A;color:#F5F3EE;padding:3px 7px;border-radius:4px">1f</span>Foco · claro (pregunta fallada)</div>
<div style="--bg:#F5F3EE;--surface:#FFFFFF;--surface-2:#EEEBE4;--line:#DDD8CE;--ink:#1D1C1A;--ink-2:#58544D;--accent:#2346C8;--ok:#1E7A4C;--ok-soft:#DEF1E5;--bad:#B5351E;--bad-soft:#FAE2DB;width:390px;height:844px;background:var(--bg);color:var(--ink);border-radius:28px;overflow:hidden;font-family:'Atkinson Hyperlegible',sans-serif;border:1px solid #BDB8AE;display:flex;flex-direction:column">
  <header style="display:flex;justify-content:space-between;align-items:center;padding:20px 16px 8px"><span style="font-size:15px;padding:6px 10px;border:1px solid var(--line);border-radius:6px">✕ Salir</span><span style="font:500 13px 'JetBrains Mono',monospace;color:var(--ink-2)">04/07 · 3 de 5</span></header>
  <div style="display:flex;gap:4px;padding:8px 16px"><div style="flex:1;height:4px;background:var(--ok);border-radius:2px"></div><div style="flex:1;height:4px;background:var(--ok);border-radius:2px"></div><div style="flex:1;height:4px;background:var(--ok);border-radius:2px"></div><div style="flex:1;height:4px;background:var(--accent);border-radius:2px"></div><div style="flex:1;height:4px;background:var(--line);border-radius:2px"></div><div style="flex:1;height:4px;background:var(--line);border-radius:2px"></div><div style="flex:1;height:4px;background:var(--line);border-radius:2px"></div></div>
  <div style="flex:1;padding:24px 16px;display:flex;flex-direction:column;gap:16px">
    <div style="font:500 12px 'JetBrains Mono',monospace;color:var(--ink-2)">QUIZ</div>
    <h2 style="margin:0;font:700 23px/1.25 'Bricolage Grotesque',sans-serif;text-wrap:pretty">¿Qué devuelve <code style="font:500 20px 'JetBrains Mono',monospace;background:var(--surface-2);padding:0 4px;border-radius:4px">3 == 3.0</code>?</h2>
    <div style="display:flex;flex-direction:column;gap:8px;font:400 16px 'JetBrains Mono',monospace">
      <div style="display:flex;justify-content:space-between;padding:14px;border:2px solid var(--ok);border-radius:8px;background:var(--ok-soft)"><span>True</span><span style="font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;color:var(--ok);font-weight:700">Correcta</span></div>
      <div style="display:flex;justify-content:space-between;padding:14px;border:2px solid var(--bad);border-radius:8px;background:var(--bad-soft)"><span>False</span><span style="font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;color:var(--bad);font-weight:700">Tu respuesta</span></div>
      <div style="padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink-2)">TypeError</div>
    </div>
    <div style="padding:10px 14px;border-left:3px solid var(--bad);font-size:16px;line-height:1.5"><strong>Por qué:</strong> <code style="font-family:'JetBrains Mono',monospace;font-size:14px">==</code> compara valor; int y float iguales dan <code style="font-family:'JetBrains Mono',monospace;font-size:14px">True</code>. En Python no existe <code style="font-family:'JetBrains Mono',monospace;font-size:14px">===</code>.</div>
  </div>
  <div style="padding:12px 16px 28px"><button style="width:100%;font:700 17px 'Atkinson Hyperlegible',sans-serif;padding:15px;border:0;border-radius:8px;background:var(--accent);color:#fff">Siguiente →</button></div>
</div>
</div>
</body>
</html>
