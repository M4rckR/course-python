<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bitácora CS50P — 2b Shorts · móvil oscuro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>*{box-sizing:border-box}body{margin:0;padding:40px;background:#D9D5CC;color:#1D1C1A;font-family:'Atkinson Hyperlegible',sans-serif}a{color:#2346C8}a:hover{color:#16308F}</style>
</head>
<body>
<div id="2b" style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;gap:8px;align-items:center;font:500 13px 'JetBrains Mono',monospace"><span style="background:#1D1C1A;color:#F5F3EE;padding:3px 7px;border-radius:4px">2b</span>Shorts · móvil oscuro</div>
<div style="--bg:#121316;--surface:#1A1C20;--surface-2:#23262C;--line:#30343B;--ink:#ECEAE4;--ink-2:#ABA79E;--ink-3:#77736A;--accent:#93AAFF;--accent-soft:#1F2846;--ok:#62D293;width:390px;height:844px;background:var(--bg);color:var(--ink);border-radius:28px;overflow:hidden;font-family:'Atkinson Hyperlegible',sans-serif;border:1px solid #BDB8AE;display:flex;flex-direction:column">
  <header style="padding:18px 16px 12px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;justify-content:space-between;align-items:center"><span style="font:500 13px 'JetBrains Mono',monospace;color:var(--ink-2)">← W1 ▾</span><span style="font-size:15px;padding:6px 10px;border:1px solid var(--line);border-radius:6px">Foco</span></div>
    <div style="font:700 26px/1 'Bricolage Grotesque',sans-serif">Condicionales</div>
    <div style="display:flex;align-items:center;gap:6px;font:500 12px 'JetBrains Mono',monospace"><span style="padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ok)">✓ Clase</span><span style="color:var(--ink-3)">→</span><span style="padding:5px 9px;border-radius:999px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700">Shorts 2/4</span><span style="color:var(--ink-3)">→</span><span style="padding:5px 9px;border-radius:999px;border:1px dashed var(--line);color:var(--ink-2)">Pset</span></div>
    <div style="display:flex;gap:16px;font-size:14px"><a href="#" style="color:var(--accent)">Notas ↗</a><a href="#" style="color:var(--accent)">Video ↗</a><a href="#" style="color:var(--accent)">Transcript ↗</a></div>
  </header>
  <div style="display:flex;gap:6px;padding:8px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;font:500 14px 'JetBrains Mono',monospace;white-space:nowrap">
    <span style="padding:8px 10px;color:var(--ok)">✓01</span><span style="padding:8px 10px;color:var(--ok)">✓02</span><span style="padding:8px 10px;color:var(--ok)">✓03</span><span style="padding:8px 12px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:700">04 Shorts</span><span style="padding:8px 10px;color:var(--ink-2)">05</span><span style="padding:8px 10px;color:var(--ink-2)">06</span><span style="padding:8px 10px;color:var(--ink-2)">07</span>
  </div>
  <div style="flex:1;padding:16px;display:flex;flex-direction:column;gap:4px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px"><span style="font:700 22px 'Bricolage Grotesque',sans-serif">Shorts</span><span style="font:500 13px 'JetBrains Mono',monospace;color:var(--ink-2)">2/4 vistos</span></div>
    <label style="display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:52px;border-top:1px solid var(--line)"><span style="width:22px;height:22px;border-radius:5px;background:var(--ok);color:#0B1F13;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center">✓</span><span style="font-size:16px;color:var(--ink-2);text-decoration:line-through">Conditionals ↗</span></label>
    <label style="display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:52px;border-top:1px solid var(--line)"><span style="width:22px;height:22px;border-radius:5px;background:var(--ok);color:#0B1F13;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center">✓</span><span style="font-size:16px;color:var(--ink-2);text-decoration:line-through">Boolean expressions ↗</span></label>
    <label style="display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:52px;border-top:1px solid var(--line)"><span style="width:22px;height:22px;border-radius:5px;border:1.5px solid var(--ink-2)"></span><span style="font-size:16px;font-weight:700;color:var(--accent)">Match statements ↗</span></label>
    <label style="display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:8px;align-items:start;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)"><span style="width:22px;height:22px;border-radius:5px;border:1.5px solid var(--ink-2)"></span><span><span style="font-size:16px;font-weight:700;color:var(--accent)">Pythonic style ↗</span><span style="display:block;margin-top:6px;font-size:14px;line-height:1.45;color:var(--ink-2)"><span style="font:500 12px 'JetBrains Mono',monospace;padding:1px 6px;border:1px dashed var(--ink-3);border-radius:999px;margin-right:6px">sin confirmar</span>Puede no ser de W1.</span></span></label>
  </div>
  <div style="padding:12px 16px 24px;border-top:1px solid var(--line);background:var(--surface)"><button style="width:100%;font:700 16px 'Atkinson Hyperlegible',sans-serif;padding:14px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink)">Ir al quiz →</button></div>
</div>
</div>
</body>
</html>
