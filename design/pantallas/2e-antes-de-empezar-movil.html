<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bitácora CS50P — 2e Antes de empezar · móvil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>*{box-sizing:border-box}body{margin:0;padding:40px;background:#D9D5CC;color:#1D1C1A;font-family:'Atkinson Hyperlegible',sans-serif}a{color:#2346C8}a:hover{color:#16308F}</style>
</head>
<body>
<div id="2e" style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;gap:8px;align-items:center;font:500 13px 'JetBrains Mono',monospace"><span style="background:#1D1C1A;color:#F5F3EE;padding:3px 7px;border-radius:4px">2e</span>Antes de empezar · móvil</div>
<div style="--bg:#F5F3EE;--surface:#FFFFFF;--surface-2:#EEEBE4;--line:#DDD8CE;--ink:#1D1C1A;--ink-2:#58544D;--ink-3:#8A857C;--accent:#2346C8;--accent-soft:#E4E9FB;--ok:#1E7A4C;width:390px;height:844px;background:var(--bg);color:var(--ink);border-radius:28px;overflow:hidden;font-family:'Atkinson Hyperlegible',sans-serif;border:1px solid #BDB8AE">
  <header style="display:flex;align-items:center;justify-content:space-between;padding:20px 20px 14px"><div style="font:700 18px 'Bricolage Grotesque',sans-serif">Bitácora <span style="color:var(--accent)">CS50P</span></div><span style="font:500 13px 'JetBrains Mono',monospace;color:var(--ink-2)">0/80</span></header>
  <div style="padding:0 16px;display:flex;flex-direction:column;gap:12px">
    <section style="border:1.5px solid var(--accent);border-radius:12px;background:var(--surface);overflow:hidden">
      <div style="padding:18px 18px 14px"><div style="font:500 12px 'JetBrains Mono',monospace;color:var(--accent)">ANTES DE EMPEZAR</div><div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:4px"><h2 style="margin:0;font:700 22px/1.15 'Bricolage Grotesque',sans-serif">Prepara tu cuenta</h2><span style="font:500 13px 'JetBrains Mono',monospace;color:var(--ink-2)">2/4</span></div></div>
      <label style="display:grid;grid-template-columns:34px 1fr;gap:6px;align-items:center;min-height:52px;padding:0 18px;border-top:1px solid var(--line)"><span style="width:22px;height:22px;border-radius:5px;background:var(--ok);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center">✓</span><span style="font-size:16px;color:var(--ink-2);text-decoration:line-through">Llenar el formulario</span></label>
      <label style="display:grid;grid-template-columns:34px 1fr;gap:6px;align-items:center;min-height:52px;padding:0 18px;border-top:1px solid var(--line)"><span style="width:22px;height:22px;border-radius:5px;background:var(--ok);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center">✓</span><span style="font-size:16px;color:var(--ink-2);text-decoration:line-through">Autorizar GitHub</span></label>
      <div style="display:grid;grid-template-columns:34px 1fr;gap:6px;padding:14px 18px 16px;border-top:1px solid var(--line);background:var(--accent-soft)"><span style="width:22px;height:22px;border-radius:5px;border:1.5px solid var(--accent);background:var(--surface)"></span><div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:16px;font-weight:700">Entrar a cs50.dev</span><span style="font-size:14px;line-height:1.45;color:var(--ink-2)">Mejor en la laptop: el editor en la nube no es cómodo en el celular.</span><a href="#" style="align-self:flex-start;font:700 15px 'Atkinson Hyperlegible',sans-serif;padding:11px 14px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none">Abrir cs50.dev ↗</a></div></div>
      <label style="display:grid;grid-template-columns:34px 1fr;gap:6px;align-items:center;min-height:52px;padding:0 18px;border-top:1px solid var(--line)"><span style="width:22px;height:22px;border-radius:5px;border:1.5px solid var(--ink-2)"></span><span style="font-size:16px">Ejecutar <code style="font:500 15px 'JetBrains Mono',monospace">update50</code></span></label>
    </section>
    <div style="border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center"><div><div style="font:500 12px 'JetBrains Mono',monospace;color:var(--ink-2)">DESPUÉS</div><div style="font:700 18px 'Bricolage Grotesque',sans-serif;margin-top:2px">W0 · Funciones</div></div><span style="font-weight:700;color:var(--accent)">Empezar →</span></div>
    <div style="font:500 12px 'JetBrains Mono',monospace;color:var(--ink-2);margin-top:12px">AL COMPLETAR LOS 4</div>
    <div style="display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:12px 16px;border:1px solid var(--line);border-radius:8px;font-size:15px"><span style="color:var(--ok);font-weight:700">✓</span><span>Preparación lista</span><span style="color:var(--ink-2);text-decoration:underline;font-size:14px">ocultar</span></div>
  </div>
</div>
</div>
</body>
</html>
