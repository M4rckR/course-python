<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bitácora CS50P — 1c Modo foco · desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>*{box-sizing:border-box}body{margin:0;padding:40px;background:#D9D5CC;color:#1D1C1A;font-family:'Atkinson Hyperlegible',sans-serif}a{color:#2346C8}a:hover{color:#16308F}</style>
</head>
<body>
<div id="1c" style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;gap:8px;align-items:center;font:500 13px 'JetBrains Mono',monospace"><span style="background:#1D1C1A;color:#F5F3EE;padding:3px 7px;border-radius:4px">1c</span>Modo foco · claro (una sección a la vez)</div>
<div style="--bg:#F5F3EE;--surface:#FFFFFF;--surface-2:#EEEBE4;--line:#DDD8CE;--ink:#1D1C1A;--ink-2:#58544D;--ink-3:#8A857C;--accent:#2346C8;--accent-soft:#E4E9FB;--ok:#1E7A4C;--ok-soft:#DEF1E5;--bad:#B5351E;--bad-soft:#FAE2DB;width:1280px;height:820px;background:var(--bg);color:var(--ink);border-radius:8px;overflow:hidden;font-family:'Atkinson Hyperlegible',sans-serif;display:flex;flex-direction:column">
  <header style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:60px;padding:0 32px">
    <button style="justify-self:start;font:15px 'Atkinson Hyperlegible',sans-serif;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);display:flex;gap:8px">Salir del foco<span style="font:500 12px 'JetBrains Mono',monospace;color:var(--ink-2);align-self:center">Esc</span></button>
    <div style="display:flex;gap:6px;align-items:center"><span style="width:28px;height:4px;border-radius:2px;background:var(--ok)"></span><span style="width:28px;height:4px;border-radius:2px;background:var(--ok)"></span><span style="width:28px;height:4px;border-radius:2px;background:var(--ok)"></span><span style="width:44px;height:4px;border-radius:2px;background:var(--accent)"></span><span style="width:28px;height:4px;border-radius:2px;background:var(--line)"></span><span style="width:28px;height:4px;border-radius:2px;background:var(--line)"></span><span style="width:28px;height:4px;border-radius:2px;background:var(--line)"></span></div>
    <span style="justify-self:end;font:500 13px 'JetBrains Mono',monospace;color:var(--ink-2)">W1 · 04 de 07</span>
  </header>
  <div style="flex:1;display:flex;justify-content:center;padding:48px 32px 0">
    <div style="width:100%;max-width:680px;display:flex;flex-direction:column;gap:22px">
      <div style="display:flex;justify-content:space-between;font:500 13px 'JetBrains Mono',monospace;color:var(--ink-2)"><span>QUIZ</span><span>PREGUNTA 2 DE 5</span></div>
      <h2 style="margin:0;font:700 30px/1.25 'Bricolage Grotesque',sans-serif;letter-spacing:-0.015em;text-wrap:pretty">¿Qué escribes en Python donde en JavaScript pondrías <code style="font:500 26px 'JetBrains Mono',monospace;background:var(--surface-2);padding:0 6px;border-radius:4px">else if</code>?</h2>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="display:grid;grid-template-columns:32px 1fr auto;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink-2)"><span style="font:500 13px 'JetBrains Mono',monospace">A</span><span style="font:400 17px 'JetBrains Mono',monospace">else if</span></div>
        <div style="display:grid;grid-template-columns:32px 1fr auto;align-items:center;padding:14px 16px;border:2px solid var(--ok);border-radius:8px;background:var(--ok-soft)"><span style="font:700 13px 'JetBrains Mono',monospace;color:var(--ok)">B</span><span style="font:500 17px 'JetBrains Mono',monospace">elif</span><span style="color:var(--ok);font-weight:700;font-size:15px">✓ Correcta</span></div>
        <div style="display:grid;grid-template-columns:32px 1fr auto;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink-2)"><span style="font:500 13px 'JetBrains Mono',monospace">C</span><span style="font:400 17px 'JetBrains Mono',monospace">elseif</span></div>
        <div style="display:grid;grid-template-columns:32px 1fr auto;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink-2)"><span style="font:500 13px 'JetBrains Mono',monospace">D</span><span style="font:400 17px 'JetBrains Mono',monospace">elsif</span></div>
      </div>
      <div style="padding:14px 18px;border-left:3px solid var(--ok);font-size:17px;line-height:1.55;text-wrap:pretty"><strong>Por qué:</strong> Python une las dos palabras en <code style="font:500 15px 'JetBrains Mono',monospace">elif</code>. Escribir <code style="font:500 15px 'JetBrains Mono',monospace">else if</code> en una línea es un <code style="font:500 15px 'JetBrains Mono',monospace">SyntaxError</code>.</div>
    </div>
  </div>
  <footer style="display:flex;justify-content:center;padding:24px 32px 36px"><div style="width:100%;max-width:680px;display:flex;justify-content:space-between;align-items:center">
    <button style="font:16px 'Atkinson Hyperlegible',sans-serif;padding:12px 16px;border:0;background:transparent;color:var(--ink-2)">← Anterior</button>
    <div style="display:flex;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:var(--ok)"></span><span style="width:8px;height:8px;border-radius:50%;background:var(--ok)"></span><span style="width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink-2)"></span><span style="width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink-2)"></span><span style="width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink-2)"></span></div>
    <button style="font:700 17px 'Atkinson Hyperlegible',sans-serif;padding:13px 26px;border:0;border-radius:8px;background:var(--accent);color:#fff;outline:2px solid var(--accent);outline-offset:3px">Siguiente →</button>
  </div></footer>
</div>
</div>
</body>
</html>
